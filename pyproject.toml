[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markettensor"
version = "0.1.0"
description = "Reproducible benchmark framework for crypto perpetual direction forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MarketTensor Contributors" }]
dependencies = [
  "hydra-core>=1.3.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "pandas>=2.2",
  "pydantic>=2.7",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "black>=25.1",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.11",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=markettensor --cov-report=term-missing"
testpaths = ["tests"]

